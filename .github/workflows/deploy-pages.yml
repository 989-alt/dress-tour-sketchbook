# GitHub Pages 배포 워크플로
#
# ⚠️  이 워크플로는 정적 자산(SVG/UI)만 배포합니다.
#     AI 합성 기능(/api/generate 서버리스 함수)은 GitHub Pages에서 작동하지 않습니다.
#     AI 기능을 포함한 전체 기능은 Vercel 배포를 사용하세요.
#
# URL: https://989-alt.github.io/dress-tour-sketchbook/

name: Deploy to GitHub Pages (UI only — AI requires Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /dress-tour-sketchbook/
      - name: Copy index.html as 404.html for SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
